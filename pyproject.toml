[project]
name = "openagbot-fieldsim"
version = "0.1.0"
description = "Simulatiewereld voor de Bruut OpenAgbot: software-in-the-loop met de echte robotsoftware"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyserial>=3.5",
    "python-can>=4.3",
    "pydantic>=2.6",
    "tifffile>=2024.1",
]

[project.optional-dependencies]
app = ["pywebview>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
openagbot_fieldsim = "openagbot_fieldsim.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openagbot_fieldsim*"]

[tool.setuptools.package-data]
openagbot_fieldsim = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: start de echte OpenAgbot-backend tegen de sim (traag, heeft F:/Agbot/Bruut_OpenAgbot nodig)"]
